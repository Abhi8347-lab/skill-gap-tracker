<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Sanity Tests — SkillSync AI</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="card" style="padding: 28px; max-width: 820px; margin: 0 auto;">
        <div class="ai-mini-badge">Node-Free Client Test Runner</div>
        <h1 style="margin: 8px 0 6px;">SkillSync AI Diagnostic &amp; Engine Sanity Checks</h1>
        <p class="card-sub" style="margin-bottom: 18px;">
          Verifies <code>getLevel(easyCorrect, hardCorrect)</code>, level-to-score mapping,
          and verified override logic directly in the browser.
        </p>
        <div id="test-summary" class="overall-pct-pill" style="display: inline-block; margin-bottom: 16px;">Running...</div>
        <ul id="test-results" class="roadmap-list"></ul>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/engine.js"></script>
    <script>
      (function () {
        const Engine = window.SkillPathEngine;
        const Questions = window.SkillSyncQuestions;
        const Data = window.SkillPathData;

        const cases = [];
        function assertEqual(name, actual, expected) {
          const passed = actual === expected;
          cases.push({ name, actual, expected, passed });
        }

        // Required getLevel() sanity checks
        assertEqual("getLevel(3, 2) -> 5/5 = Expert", Engine.getLevel(3, 2), "Expert");
        assertEqual("getLevel(3, 1) -> 4/5 with 3 easy = Intermediate", Engine.getLevel(3, 1), "Intermediate");
        assertEqual("getLevel(2, 1) -> 3/5 with 2 easy + 1 hard = Intermediate", Engine.getLevel(2, 1), "Intermediate");
        assertEqual("getLevel(1, 2) -> 3/5 with 1 easy + 2 hard = Beginner", Engine.getLevel(1, 2), "Beginner");
        assertEqual("getLevel(2, 0) -> 2/5 = Beginner", Engine.getLevel(2, 0), "Beginner");
        assertEqual("getLevel(0, 0) -> 0/5 = Beginner", Engine.getLevel(0, 0), "Beginner");

        // Verified percentage mapping checks
        assertEqual("Beginner -> 30%", Engine.getLevelPct("Beginner"), 30);
        assertEqual("Intermediate -> 60%", Engine.getLevelPct("Intermediate"), 60);
        assertEqual("Expert -> 90%", Engine.getLevelPct("Expert"), 90);

        // Verified level overrides self-rated score in analyzeProfile()
        const analysis = Engine.analyzeProfile(
          {
            name: "Test User",
            targetRole: "junior_data_analyst",
            companyPriority: "Dashboards",
            skillScores: { sql: 80, power_bi: 40, statistics: 55 },
            weeklyHours: "5-10",
            experience: "0-1",
          },
          {},
          {
            currentEmployeeId: "emp_test",
            verifiedLevelsOverride: {
              sql: { level: "Beginner", score: 2, verifiedPct: 30 },
              power_bi: { level: "Expert", score: 5, verifiedPct: 90 },
            },
            priorities: [{ skillId: "power_bi", weight: 5 }],
          }
        );
        const sqlItem = analysis.roadmap.find((s) => s.skillId === "sql");
        const pbiItem = analysis.roadmap.find((s) => s.skillId === "power_bi");
        const statItem = analysis.roadmap.find((s) => s.skillId === "statistics");

        assertEqual("Verified Beginner overrides SQL 80% -> 30%", sqlItem.effectivePct, 30);
        assertEqual("Verified Expert overrides Power BI 40% -> 90%", pbiItem.effectivePct, 90);
        assertEqual("Untested Statistics keeps self-rated 55%", statItem.effectivePct, 55);
        assertEqual("Untested Statistics marked Unverified", statItem.isVerified, false);

        // Question bank coverage check
        const allCatalogCovered = Data.SKILLS_CATALOG.every((s) =>
          Questions.hasQuestions(s.id)
        );
        assertEqual("Every catalog skill has 3 easy + 2 hard offline questions", allCatalogCovered, true);

        const passedCount = cases.filter((c) => c.passed).length;
        const summaryEl = document.getElementById("test-summary");
        summaryEl.textContent = `${passedCount} / ${cases.length} Passed`;
        summaryEl.style.background = passedCount === cases.length ? "var(--strong-bg)" : "var(--missing-bg)";
        summaryEl.style.color = passedCount === cases.length ? "var(--strong-fg)" : "var(--missing-fg)";

        document.getElementById("test-results").innerHTML = cases
          .map(
            (c) => `
          <li class="roadmap-step ${c.passed ? "status-border-strong" : ""}">
            <span class="roadmap-step-num ${c.passed ? "status-dot-strong" : "status-dot-missing"}">${c.passed ? "✓" : "✕"}</span>
            <div class="roadmap-step-body">
              <strong>${c.name}</strong>
              <div class="muted-note">Expected: ${String(c.expected)} · Actual: ${String(c.actual)}</div>
            </div>
          </li>
        `
          )
          .join("");
      })();
    </script>
  </body>
</html>
